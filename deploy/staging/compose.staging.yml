# dsbot STAGING (T13, проверка на текущем Windows-хосте перед Linux-переносом).
#
# Отличия от production профиля — только изоляция идентичностей:
#   - отдельный compose-проект (dsbot-staging), СВОИ named volumes (имена задаются
#     в env-файле staging и не должны совпадать с прод), СВОЯ internal-сеть;
#   - приложение пишет в mongo-контейнер этого проекта, база voice_tracker_staging
#     (validate_env.py отказывает staging на прод-имени БД и на точных прод-
#     отпечатках томов, R26-06 п.4);
#   - web слушает другой loopback-порт;
#   - image references — ТЕ ЖЕ переменные и те же самые images, что и production
#     (тест того артефакта, что пойдёт на Linux).
#
# R26-06 (V26-16): единый источник env — env_file ссылается на ${DSBOT_ENV_FILE},
# который deploy-скрипты передают и как --env-file для интерполяции. Старый
# относительный env_file без переменной (docker резолвил его от каталога
# compose-файла) запрещён.
# R26-06 (V26-17): gateway/commands/activity/stalker/web получают вторую сеть
# dsbot-egress (bridge = NAT) для Discord REST/Gateway/OAuth; mongo/nats/
# tracker/writer/controlplane в egress НЕ состоят.
#
# R26-07: auth включён — mongod поднят с --auth; все runtime-URI аутентифицированные
# и приходят из env-файла: x-bot-env → ${MONGO_BOT_URI} (dsbot_app, без DDL-роли),
# web → ${MONGO_WEB_URI} (dsbot_web); безпарольный URI на сервис mongo в compose
# запрещён (проверяет validate_compose.py). Начальные права создаёт ОДНОРАЗОВЫЙ
# mongo-bootstrap под ЯВНЫМ профилем bootstrap (в обычный up не входит; на staging
# репетируется ровно тот прогон, что пойдёт на прод).
# Схема-раннер (review R26-07, blocker 2) — ОДНОРАЗОВЫЙ сервис schema-migrate под
# ЯВНЫМ профилем migrate: MONGO_URI=${MONGO_MIGRATION_URI} (dsbot_migration,
# единственная роль с DDL) + MONGO_DB; ровно та же форма, что на проде
# (`migrate up`/`migrate status`). Безпарольный loopback — исключительное право
# mongo-bootstrap (localhost exception), runner под ним не ходит.
#
# Успех на NTFS НЕ подтверждает Linux-права (UID/GID, case sensitivity, atomic
# rename) — эти проверки отдельные, на Linux-стенде (см. runbook раздел Linux).

name: dsbot-staging

x-defaults: &app-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"
  networks:
    - dsbot-data
  user: "${DSBOT_UID:?set in staging env}:${DSBOT_GID:?set in staging env}"

x-bot-env: &bot-env
  # R26-07: mongod с --auth — bot-URI аутентифицированный (dsbot_app, DDL-роли нет)
  # и берётся из env-файла staging; URI фиксирован на mongo-контейнер этого проекта.
  MONGO_URI: "${MONGO_BOT_URI:?authenticated bot URI (dsbot_app, no DDL role) — env file}"
  NATS_URL: nats://nats:4222
  MEDIA_DIR: /data/media

services:
  mongo:
    image: ${MONGO_IMAGE:?pin mongo:7 by digest in env file}
    # R26-07: auth включён. Healthcheck-mongosh ping разрешён без credentials,
    # поэтому его команда намеренно не меняется.
    command: ["--auth"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - dsbot-data
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # R26-07: одноразовый job начальных прав (`migrate users --bootstrap`,
  # grants-сверка). Явный профиль: docker compose --profile bootstrap run
  # mongo-bootstrap python -m voice_tracker.migrate users --bootstrap. НЕ
  # автозапуск (restart: "no" + профиль) — иначе ломает повторные up.
  # localhost exception mongod --auth принимает только с 127.0.0.1 — отсюда
  # network_mode: service:mongo (пароли root/пользователей — из env_file).
  mongo-bootstrap:
    image: "${BOOTSTRAP_IMAGE:?python image with voice_tracker + pymongo}"
    restart: "no"
    network_mode: service:mongo
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    environment:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: ${MONGO_DB:?}
    user: "${DSBOT_UID:?}:${DSBOT_GID:?}"
    profiles: ["bootstrap"]

  # R26-07 (review, blocker 2): ОДНОРАЗОВЫЙ job миграции схемы — единственная
  # легальная точка `migrate up`/`migrate status` (на staging репетируется ровно
  # тот прогон, что пойдёт на прод). Явный профиль migrate + restart "no":
  #   docker compose --profile migrate run --rm schema-migrate python -m voice_tracker.migrate up
  #   docker compose --profile migrate run --rm schema-migrate python -m voice_tracker.migrate status
  # Credentials — ровно MONGO_MIGRATION_URI (dsbot_migration: CRUD +
  # createIndex/dropIndex/createCollection/collMod); runtime-URI без DDL-роли для
  # runner негодны, admin/root — избыточны (DB06). env_file НЕ подключается:
  # раннеру нужны только MONGO_URI/MONGO_DB (ср. web, R26-06 п.5). Хост `mongo`
  # из URI резолвится только в internal dsbot-data; egress не нужен.
  schema-migrate:
    image: "${BOOTSTRAP_IMAGE:?python image with voice_tracker + pymongo}"
    restart: "no"
    networks:
      - dsbot-data
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: "${MONGO_MIGRATION_URI:?authenticated migration URI (dsbot_migration, DDL role) — env file}"
      MONGO_DB: ${MONGO_DB:?}
    user: "${DSBOT_UID:?}:${DSBOT_GID:?}"
    profiles: ["migrate"]

  nats:
    image: ${NATS_IMAGE:?pin nats:2.10-alpine by digest in env file}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - dsbot-data
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  gateway:
    <<: *app-defaults
    image: ${BOT_GATEWAY_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    networks:
      - dsbot-data
      - dsbot-egress
    environment:
      <<: *bot-env
      SERVICE_NAME: gateway
    volumes:
      - media:/data/media
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  tracker:
    <<: *app-defaults
    image: ${BOT_TRACKER_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    environment:
      <<: *bot-env
      SERVICE_NAME: tracker
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  writer:
    <<: *app-defaults
    image: ${BOT_WRITER_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    environment:
      <<: *bot-env
      SERVICE_NAME: writer
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  commands:
    <<: *app-defaults
    image: ${BOT_COMMANDS_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    networks:
      - dsbot-data
      - dsbot-egress
    environment:
      <<: *bot-env
      SERVICE_NAME: commands
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  activity:
    <<: *app-defaults
    image: ${BOT_ACTIVITY_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    networks:
      - dsbot-data
      - dsbot-egress
    environment:
      <<: *bot-env
      SERVICE_NAME: activity
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  stalker:
    <<: *app-defaults
    image: ${BOT_STALKER_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    networks:
      - dsbot-data
      - dsbot-egress
    environment:
      <<: *bot-env
      SERVICE_NAME: stalker
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # как в production: по умолчанию НЕ запускается (ADR-0004)
  controlplane:
    <<: *app-defaults
    profiles: ["controlplane"]
    image: ${BOT_CONTROLPLANE_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    environment:
      <<: *bot-env
      SERVICE_NAME: controlplane
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web:
    <<: *app-defaults
    image: ${WEB_IMAGE:?}
    networks:
      - dsbot-data
      - dsbot-egress
    # R26-06 (п.5): web без общего env_file — ровно ключи, которые читает
    # wt-web api/config.py (набор идентичен production; см. комментарий там).
    # staging гоняет ТЕ ЖЕ production-гарды (T02 fail-closed), отличается только
    # изоляцией данных (свои volumes/DB/сеть) и тестовыми Discord-идентичностями.
    # R26-07: web-URI аутентифицированный (dsbot_web, без DDL-роли) — из env-файла.
    environment:
      MONGO_URI: "${MONGO_WEB_URI:?authenticated web URI (dsbot_web, no DDL role) — env file}"
      MEDIA_DIR: /data/media
      WEB_ENV: production
      MONGO_DB: ${MONGO_DB:?}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?}
      WEB_GUILD_ALLOWLIST: ${WEB_GUILD_ALLOWLIST:?}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      WEB_PORT: ${WEB_PORT:-8000}
      WEB_SESSION_MAX_AGE_HOURS: ${WEB_SESSION_MAX_AGE_HOURS:-}
      WEB_QUERY_MAX_TIME_MS: ${WEB_QUERY_MAX_TIME_MS:-}
      WEB_MEDIA_MIN_FREE_BYTES: ${WEB_MEDIA_MIN_FREE_BYTES:-}
    ports:
      - "${WEB_INGRESS_BIND:-127.0.0.1}:${WEB_HOST_PORT:-8090}:8000"
    volumes:
      - media:/data/media:ro
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  mongo-data:
    name: ${MONGO_VOLUME:?staging must name its own mongo volume (not the prod one)}
  media:
    name: ${MEDIA_VOLUME:?staging must name its own media volume (not the prod one)}

networks:
  dsbot-data:
    internal: true
  # V26-17: NAT-egress для Discord (только web и сервисы с внешними вызовами);
  # НЕ external — не требует предсуществования.
  dsbot-egress:
    internal: false
