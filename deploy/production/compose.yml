# dsbot production deployment (T13).
#
# Инварианты (проверяются deploy/scripts/validate_compose.py через `compose config`):
#   - только immutable image references (registry/name@sha256:<digest> из env-файла);
#     `build:` и bind-монты кода запрещены;
#   - наружу публикуется только ingress web, и только на loopback (реверс-прокси —
#     снаружи); mongo/nats приложений — internal-сеть без published ports;
#   - Mongo/NATS — выделенные контейнеры этого проекта с named volumes; переезд с
#     Windows-host Mongo — отдельная backup/restore миграция (T14), не молчаливая
#     смена URI;
#   - restart policy + healthchecks + resource ceilings + log rotation;
#   - controlplane НЕ стартует по умолчанию (ADR-0004): профиль controlplane.
#
# R26-06 (V26-16): ЕДИНЫЙ источник env. env_file ссылается на ${DSBOT_ENV_FILE} —
# путь, который подставляют deploy-скрипты тем же значением, что и --env-file для
# интерполяции. Старый относительный env_file без переменной (его docker резолвил
# от каталога compose-файла) запрещён: DSBOT_ENV_FILE для контейнеров больше не
# игнорируется.
# R26-06 (V26-17): egress. dsbot-data остаётся internal (всё межсервисное), но
# gateway/commands/activity/stalker/web получают вторую сеть dsbot-egress (обычная
# bridge = NAT наружу) — без неё Discord REST/Gateway/OAuth физически невозможны.
# mongo/nats/tracker/writer/controlplane в egress НЕ состоят.
#
# R26-07: auth включён — mongod поднят с --auth; все runtime-URI аутентифицированные
# и приходят из env-файла: x-bot-env → ${MONGO_BOT_URI} (dsbot_app, без DDL-роли),
# web → ${MONGO_WEB_URI} (dsbot_web); безпарольный URI на сервис mongo в compose
# запрещён (проверяет validate_compose.py). Начальные права создаёт ОДНОРАЗОВЫЙ
# mongo-bootstrap под ЯВНЫМ профилем bootstrap (в обычный up не входит, иначе
# ломает повторные прогоны): localhost exception mongod принимает подключение
# только с 127.0.0.1 — поэтому bootstrap идёт в сетевом namespace mongo-контейнера.
# Схема-раннер (review R26-07, blocker 2) — ОДНОРАЗОВЫЙ же сервис schema-migrate
# под ЯВНЫМ профилем migrate: MONGO_URI=${MONGO_MIGRATION_URI} (dsbot_migration,
# единственная роль с DDL) + MONGO_DB; годится и для `migrate up`, и для
# `migrate status`. Безпарольный loopback остаётся исключительным правом
# mongo-bootstrap (localhost exception): под ним runner не ходит.
# Review R26-07 (blocker 3): runtime — verify-only: x-bot-env явно фиксирует
# DSBOT_SCHEMA_MODE: verify (environment > env_file), поэтому env-файл не может
# включить в бот-сервисах DDL-режим bootstrap; bootstrap — локальный dev вне
# этого deploy-профиля.
#
# Все project/file/env пути задаёт scripts/deploy.sh; из случайного cwd не запускать.
# Значения секретов живут только в env-файле хоста (chmod 600), не в git.

name: dsbot-prod

x-defaults: &app-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - dsbot-data
  # Ожидаемый uid/gid на Linux (linux_init.sh готовит media volume под него).
  user: "${DSBOT_UID:?set in env file}:${DSBOT_GID:?set in env file}"

x-bot-env: &bot-env
  # Зависимости фиксированы на контейнеры этого же проекта — staging/prod не могут
  # случайно указать на чужую (в т.ч. прод) базу.
  # R26-07: mongod с --auth — bot-URI аутентифицированный (dsbot_app, DDL-роли нет)
  # и берётся из env-файла, значения в git не живут.
  MONGO_URI: "${MONGO_BOT_URI:?authenticated bot URI (dsbot_app, no DDL role) — env file}"
  NATS_URL: nats://nats:4222
  MEDIA_DIR: /data/media
  # Review R26-07 (blocker 3): runtime deploy-профиля — строго verify-only.
  # environment приоритетнее env_file, поэтому строка DSBOT_SCHEMA_MODE=bootstrap
  # в выбранном env-файле больше не может перевести бот-сервисы в mutating-режим
  # (ensure_indexes = DDL под runtime app-креденшеллами). bootstrap остаётся
  # локальной dev-возможностью вне deploy-профилей; validate_env отвергает его в
  # env-файлах production/staging, а факт в рендере сверяет validate_compose.
  # Одноразовые job'ы (mongo-bootstrap, schema-migrate) этот якорь НЕ получают.
  DSBOT_SCHEMA_MODE: verify

services:
  mongo:
    image: ${MONGO_IMAGE:?pin mongo:7 by digest in env file}
    # R26-07: auth включён. Healthcheck-mongosh ping разрешён без credentials,
    # поэтому его команда намеренно не меняется.
    command: ["--auth"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dsbot-data
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # R26-07: одноразовый job начальных прав (`migrate users --bootstrap`,
  # grants-сверка). Явный профиль: docker compose --profile bootstrap run
  # mongo-bootstrap python -m voice_tracker.migrate users --bootstrap. НЕ
  # автозапуск (restart: "no" + профиль) — иначе ломает повторные up.
  # localhost exception mongod --auth принимает только с 127.0.0.1 — отсюда
  # network_mode: service:mongo (пароли root/пользователей — из env_file).
  mongo-bootstrap:
    image: "${BOOTSTRAP_IMAGE:?python image with voice_tracker + pymongo}"
    restart: "no"
    network_mode: service:mongo
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    environment:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: ${MONGO_DB:?}
    user: "${DSBOT_UID:?}:${DSBOT_GID:?}"
    profiles: ["bootstrap"]

  # R26-07 (review, blocker 2): ОДНОРАЗОВЫЙ job миграции схемы — единственная
  # легальная точка `migrate up`/`migrate status` на проде. Явный профиль
  # migrate (в обычный up не входит) + restart "no" (не resident):
  #   docker compose --profile migrate run --rm schema-migrate python -m voice_tracker.migrate up
  #   docker compose --profile migrate run --rm schema-migrate python -m voice_tracker.migrate status
  # Credentials — ровно MONGO_MIGRATION_URI (dsbot_migration: CRUD +
  # createIndex/dropIndex/createCollection/collMod). Runtime-URI (dsbot_app/
  # dsbot_web) без DDL-роли для runner негодны, admin/root — избыточны (DB06).
  # env_file НЕ подключается: раннеру нужны только MONGO_URI/MONGO_DB
  # (интерполяция из выбранного env-файла), весь остальной секрет-набор env
  # в контейнер одноразового прогона не мигрирует (ср. web, R26-06 п.5).
  # Хост `mongo` из URI резолвится только в internal dsbot-data; egress не нужен.
  schema-migrate:
    image: "${BOOTSTRAP_IMAGE:?python image with voice_tracker + pymongo}"
    restart: "no"
    networks:
      - dsbot-data
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: "${MONGO_MIGRATION_URI:?authenticated migration URI (dsbot_migration, DDL role) — env file}"
      MONGO_DB: ${MONGO_DB:?}
    user: "${DSBOT_UID:?}:${DSBOT_GID:?}"
    profiles: ["migrate"]

  nats:
    image: ${NATS_IMAGE:?pin nats:2.10-alpine by digest in env file}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dsbot-data
    # мониторинг-эндпоинт http://nats:8222 — только внутри internal-сети
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  gateway:
    <<: *app-defaults
    image: ${BOT_GATEWAY_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    networks:
      - dsbot-data
      - dsbot-egress
    environment:
      <<: *bot-env
      SERVICE_NAME: gateway
    volumes:
      # gateway ЕДИНСТВЕННЫЙ пишёт media (вложения); web читает ro
      - media:/data/media
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  tracker:
    <<: *app-defaults
    image: ${BOT_TRACKER_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    environment:
      <<: *bot-env
      SERVICE_NAME: tracker
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  writer:
    <<: *app-defaults
    image: ${BOT_WRITER_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    environment:
      <<: *bot-env
      SERVICE_NAME: writer
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  commands:
    <<: *app-defaults
    image: ${BOT_COMMANDS_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    networks:
      - dsbot-data
      - dsbot-egress
    environment:
      <<: *bot-env
      SERVICE_NAME: commands
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  activity:
    <<: *app-defaults
    image: ${BOT_ACTIVITY_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    networks:
      - dsbot-data
      - dsbot-egress
    environment:
      <<: *bot-env
      SERVICE_NAME: activity
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  stalker:
    <<: *app-defaults
    image: ${BOT_STALKER_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    networks:
      - dsbot-data
      - dsbot-egress
    environment:
      <<: *bot-env
      SERVICE_NAME: stalker
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ADR-0004: controlplane (consumer новой архитектуры) НЕ входит в дефолтный
  # релиз — активного потребителя нет; `docker compose --profile controlplane
  # up controlplane` только осознанно. Статус Up — не основание включать.
  controlplane:
    <<: *app-defaults
    profiles: ["controlplane"]
    image: ${BOT_CONTROLPLANE_IMAGE:?}
    env_file:
      - "${DSBOT_ENV_FILE:?set by deploy scripts (single source of env)}"
    environment:
      <<: *bot-env
      SERVICE_NAME: controlplane
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web:
    <<: *app-defaults
    image: ${WEB_IMAGE:?}
    networks:
      - dsbot-data
      - dsbot-egress
    # R26-06 (п.5): web НЕ получает общий env_file — только ровно те ключи,
    # которые читает wt-web api/config.py (проверено grep'ом: набор ниже).
    # Backend-only ключи (BACKUP_DIR, BACKUP_AGE_KEY_FILE, EVENT_SIGNING_SECRET,
    # MIGRATION*, ботные DISCORD_GUILD_ID/BOT_ADMIN_USER_IDS) к web не мигрируют.
    # DISCORD_TOKEN включён: web читает его (api/config.py), и production-гард
    # требует его непустым (валидация invite через Discord REST).
    # Значения подставляет интерполяция из env-файла, выбранного deploy-скриптом.
    # R26-07: web-URI аутентифицированный (dsbot_web, без DDL-роли) — из env-файла.
    environment:
      MONGO_URI: "${MONGO_WEB_URI:?authenticated web URI (dsbot_web, no DDL role) — env file}"
      MEDIA_DIR: /data/media
      WEB_ENV: production
      MONGO_DB: ${MONGO_DB:?}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?}
      WEB_GUILD_ALLOWLIST: ${WEB_GUILD_ALLOWLIST:?}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      WEB_PORT: ${WEB_PORT:-8000}
      WEB_SESSION_MAX_AGE_HOURS: ${WEB_SESSION_MAX_AGE_HOURS:-}
      WEB_QUERY_MAX_TIME_MS: ${WEB_QUERY_MAX_TIME_MS:-}
      WEB_MEDIA_MIN_FREE_BYTES: ${WEB_MEDIA_MIN_FREE_BYTES:-}
    ports:
      # единственный ingress; TLS/публичный интерфейс — реверс-прокси снаружи
      - "${WEB_INGRESS_BIND:-127.0.0.1}:${WEB_HOST_PORT:-8000}:8000"
    volumes:
      - media:/data/media:ro
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  mongo-data:
    name: ${MONGO_VOLUME:?name mongo volume explicitly (per-environment; linux_init.sh)}
  media:
    name: ${MEDIA_VOLUME:?name media volume explicitly (linux_init.sh chowns it)}

networks:
  dsbot-data:
    internal: true
  # V26-17: обычная bridge (NAT) для Discord REST/Gateway/OAuth у web и
  # бот-сервисов с внешними вызовами; НЕ external — не требует предсуществования.
  dsbot-egress:
    internal: false
