services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  nats:
    image: nats:2
    ports:
      - "127.0.0.1:4222:4222"

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    env_file:
      - .env
    depends_on:
      - mongo
      - nats
    # T12/R07: crash-restart делает restart policy; HEALTHCHECK из Dockerfile
    # только сигнализирует (unhealthy ≠ авто-рестарт) — restart storm за этим
    # файлом не стоит: упавшая Mongo не вызывает бег на месте у приложений.
    restart: unless-stopped

  tracker:
    build:
      context: .
      args:
        SERVICE: tracker
    env_file:
      - .env
    depends_on:
      - mongo
      - nats
    # T12/R07: crash-restart делает restart policy; HEALTHCHECK из Dockerfile
    # только сигнализирует (unhealthy ≠ авто-рестарт) — restart storm за этим
    # файлом не стоит: упавшая Mongo не вызывает бег на месте у приложений.
    restart: unless-stopped

  writer:
    build:
      context: .
      args:
        SERVICE: writer
    env_file:
      - .env
    depends_on:
      - mongo
      - nats
    # T12/R07: crash-restart делает restart policy; HEALTHCHECK из Dockerfile
    # только сигнализирует (unhealthy ≠ авто-рестарт) — restart storm за этим
    # файлом не стоит: упавшая Mongo не вызывает бег на месте у приложений.
    restart: unless-stopped

  commands:
    build:
      context: .
      args:
        SERVICE: commands
    env_file:
      - .env
    depends_on:
      - mongo
      - nats
    # T12/R07: crash-restart делает restart policy; HEALTHCHECK из Dockerfile
    # только сигнализирует (unhealthy ≠ авто-рестарт) — restart storm за этим
    # файлом не стоит: упавшая Mongo не вызывает бег на месте у приложений.
    restart: unless-stopped

  activity:
    build:
      context: .
      args:
        SERVICE: activity
    env_file:
      - .env
    depends_on:
      - mongo
      - nats
    # T12/R07: crash-restart делает restart policy; HEALTHCHECK из Dockerfile
    # только сигнализирует (unhealthy ≠ авто-рестарт) — restart storm за этим
    # файлом не стоит: упавшая Mongo не вызывает бег на месте у приложений.
    restart: unless-stopped

  stalker:
    build:
      context: .
      args:
        SERVICE: stalker
    env_file:
      - .env
    depends_on:
      - mongo
      - nats
    # T12/R07: crash-restart делает restart policy; HEALTHCHECK из Dockerfile
    # только сигнализирует (unhealthy ≠ авто-рестарт) — restart storm за этим
    # файлом не стоит: упавшая Mongo не вызывает бег на месте у приложений.
    restart: unless-stopped

  controlplane:
    build:
      context: .
      args:
        SERVICE: controlplane
    env_file:
      - .env
    depends_on:
      - mongo
      - nats
    # T12/R07: crash-restart делает restart policy; HEALTHCHECK из Dockerfile
    # только сигнализирует (unhealthy ≠ авто-рестарт) — restart storm за этим
    # файлом не стоит: упавшая Mongo не вызывает бег на месте у приложений.
